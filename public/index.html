<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ボードゲーム広場</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <script>
    // LINE などのアプリの中のブラウザでは、うまく読み込めないことがあるので、ふつうのブラウザで開き直す
    // （LINE は URL に openExternalBrowser=1 を付けると Safari / Chrome で開く）
    (function () {
      try {
        var ua = navigator.userAgent || '';
        if (/\bLine\//i.test(ua) && !/openExternalBrowser=1/.test(location.search)) {
          var q = location.search ? location.search + '&' : '?';
          location.replace(location.pathname + q + 'openExternalBrowser=1' + location.hash);
        }
      } catch (e) { /* 何もしない */ }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 読み込みに時間がかかったり失敗したりしたときのお知らせ（style.css が読めなくても見えるよう、見た目はここに書く） -->
  <div id="boot" style="position:fixed;left:0;right:0;top:0;z-index:100;padding:14px 16px;background:#fff7d6;color:#3a2c00;font:15px/1.6 sans-serif;border-bottom:1px solid #e6d58a;display:none">
    <b id="boot-title">読み込みに時間がかかっています…</b><br>
    <span id="boot-text">サーバーが起きるまで30秒ほどかかることがあります。少し待っても変わらないときは、下のボタンで読み込み直してください。<br>
    LINE などのアプリの中で開いている場合は、Safari や Chrome で開くと表示されやすくなります。</span><br>
    <button type="button" onclick="location.reload()" style="margin-top:8px;padding:8px 18px;font-size:15px;border-radius:8px;border:1px solid #b89a2a;background:#f2c230;color:#3a2c00">読み込み直す</button>
  </div>
  <script>
    // app.js が動き出したら window.__booted = true になる。8秒たっても動かなければお知らせを出す
    (function () {
      function show(title) {
        if (window.__booted) return;
        var b = document.getElementById('boot');
        if (title) document.getElementById('boot-title').textContent = title;
        b.style.display = 'block';
      }
      setTimeout(function () { show(); }, 8000);
      window.addEventListener('error', function (e) {
        // スクリプトが読めなかった・この端末では動かない書き方だったとき
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) show('ファイルを読み込めませんでした');
        else if (!window.__booted) setTimeout(function () { show('この端末・ブラウザではうまく動かないかもしれません'); }, 1500);
      }, true);
    })();
  </script>
  <header class="topbar">
    <a class="brand" href="#" id="brand">♞ ボードゲーム広場</a>
    <label class="name-field">名前
      <input id="name" maxlength="16" autocomplete="nickname" placeholder="名無し">
    </label>
    <span id="conn" class="conn off" title="サーバー接続状態"></span>
  </header>

  <main id="lobby" class="lobby">
    <section class="hero">
      <h1>友だちとオンライン対戦</h1>
      <p>ゲームを選んで部屋を作り、招待リンクを送るだけ。</p>
    </section>

    <section class="game-groups" id="game-cards"></section>

    <section class="panel join-panel">
      <h2>部屋コードで参加</h2>
      <form id="join-form" class="row">
        <input id="join-code" maxlength="5" placeholder="例: K7Q2M" autocapitalize="characters" spellcheck="false">
        <button type="submit" class="btn primary">参加</button>
      </form>
    </section>

    <section class="panel">
      <h2>部屋一覧 <span id="online" class="muted small"></span></h2>
      <ul id="room-list" class="room-list"></ul>
    </section>
  </main>

  <main id="room" class="room" hidden>
    <div class="room-head">
      <button id="leave" class="btn ghost">← ロビー</button>
      <h2 id="room-title"></h2>
      <div class="invite">
        <span class="muted small">部屋コード</span>
        <code id="room-code"></code>
        <button id="copy-link" class="btn small">招待リンクをコピー</button>
      </div>
    </div>

    <div class="room-body">
      <div class="board-col">
        <div id="player-top" class="player"></div>
        <div id="board" class="board-host"></div>
        <div id="player-bottom" class="player"></div>
      </div>

      <aside class="side-col">
        <div id="status" class="status"></div>
        <div id="controls" class="controls"></div>
        <div class="panel tight">
          <h3 id="history-title">棋譜</h3>
          <ul id="history" class="history"></ul>
        </div>
        <div class="panel tight chat">
          <h3>チャット <span id="spectators" class="muted small"></span><button id="nico-toggle" class="btn small ghost" type="button" title="チャットを画面に流すかどうか"></button></h3>
          <ul id="chat-log" class="chat-log"></ul>
          <form id="chat-form" class="row">
            <input id="chat-input" maxlength="200" placeholder="メッセージ" autocomplete="off">
            <button class="btn">送信</button>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <p id="modal-title"></p>
      <div id="modal-options" class="modal-options"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <!-- ニコニコ風に流れるチャット -->
  <div id="nico" class="nico" aria-hidden="true"></div>
  <button id="quick-chat-btn" class="quick-chat-btn" type="button" title="チャットを書く" hidden>💬</button>
  <form id="quick-chat" class="quick-chat" hidden>
    <input id="quick-chat-input" maxlength="200" placeholder="コメントを書く（画面に流れます）" autocomplete="off" enterkeyhint="send">
    <button class="btn primary">送信</button>
    <button id="quick-chat-close" class="btn ghost" type="button" title="閉じる">✕</button>
  </form>

  <!-- 並べ替え（ito）に使う SortableJS 1.15.6（MIT）。外部サイトに頼らないよう、このサーバーから配る -->
  <script src="/vendor/Sortable.min.js" defer></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
